[package]
name = "trail-status-infer"
version = "0.1.0"
edition = "2021"

[lib]
name = "trail_status_infer"
path = "src/lib.rs"

[dependencies]
aprender = { path = "/home/alfredo/code/aprender", default-features = false }
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "trail-status-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "trail-status-api"
path = "src/bin/api.rs"

[[bin]]
name = "make-bundle"
path = "src/bin/make_bundle.rs"
